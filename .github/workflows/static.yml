name: Build and deploy Grid Pulse

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Run pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Restore annual state source cache
        id: state-source-cache
        uses: actions/cache@v5
        with:
          path: |
            grid-pulse/data/source/nasa-power-climatology.json
            grid-pulse/data/source/state-generation.json
            grid-pulse/data/source/state-emissions.json
          key: state-energy-v1-2019-2024-${{ hashFiles('pipeline/nasa_power_client.py', 'pipeline/eia_state_client.py') }}

      - name: Fetch EIA data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python -m pipeline.eia_client \
            --hours 744 \
            --output-dir grid-pulse/data/source

      - name: Fetch NASA POWER climatology
        if: steps.state-source-cache.outputs.cache-hit != 'true'
        run: python -m pipeline.nasa_power_client

      - name: Fetch annual EIA state data
        if: steps.state-source-cache.outputs.cache-hit != 'true'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m pipeline.eia_state_client --start-year 2019 --end-year 2024

      - name: Validate and build dashboard data
        run: |
          python -m pipeline.build \
            --source-dir grid-pulse/data/source \
            --output-dir grid-pulse/data
          python -m pipeline.resource_map
          python -m pipeline.state_energy

      - name: Assemble static site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.venv/' \
            --exclude='_site/' \
            --exclude='pipeline/' \
            --exclude='tests/' \
            --exclude='gridpulse_examples/' \
            --exclude='grid-pulse/data/source/' \
            --exclude='grid-pulse/data/sample/' \
            --exclude='eia_api_key' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
